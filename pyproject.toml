[project]
name = "mcp-mattermost"
version = "0.2.0"
description = "Mattermost MCP server: typed daily-use core plus find/describe/call over the full REST v4 OpenAPI spec"
authors = [{ name = "Peter Gomez" }]
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastmcp[openapi]>=3.4,<4",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
# Optional[...] over `X | None` is a house preference (peter's CLAUDE.md python rules)
ignore = ["UP007", "UP045"]
